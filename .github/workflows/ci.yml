name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run tests
        run: go test ./... -short -count=1 -timeout 300s

      - name: Run tests with race detector
        run: go test -race ./... -short -count=1 -timeout 300s

      - name: Run W3C conformance tests
        run: |
          echo "=== Turtle ===" && go test ./turtle/ -run TestW3C -v -count=1 -timeout 120s 2>&1 | tail -1
          echo "=== N-Triples ===" && go test ./nt/ -run TestW3C -v -count=1 -timeout 120s 2>&1 | tail -1
          echo "=== N-Quads ===" && go test ./nq/ -run TestW3C -v -count=1 -timeout 120s 2>&1 | tail -1
          echo "=== RDF/XML ===" && go test ./rdfxml/ -run TestW3C -v -count=1 -timeout 120s 2>&1 | tail -1
          echo "=== TriG ===" && go test ./trig/ -run TestW3C -v -count=1 -timeout 120s 2>&1 | tail -1
          echo "=== SPARQL 1.1 ===" && go test ./sparql/ -run 'TestW3C$$' -v -count=1 -timeout 120s 2>&1 | tail -1
          echo "=== SPARQL 1.2 ===" && go test ./sparql/ -run TestW3CSPARQL12 -v -count=1 -timeout 120s 2>&1 | tail -1
          echo "=== SPARQL Update ===" && go test ./sparql/ -run TestW3CUpdate -v -count=1 -timeout 120s 2>&1 | tail -1
          echo "=== SHACL ===" && go test ./shacl/ -run TestW3C -v -count=1 -timeout 120s 2>&1 | tail -1
          echo "=== Reasoning ===" && go test ./reasoning/ -run TestW3C -v -count=1 -timeout 120s 2>&1 | tail -1

      - name: Check build
        run: go build ./...

      - name: Run vet
        run: go vet ./...

  # An out-of-tree store implements store.Store and runs the shared conformance
  # suite from store/storetest. Nothing in this repository compiles it, so a
  # change to the Store interface or to the suite breaks it silently — this job
  # is what turns that into a red build here instead of a bug report there.
  satellite-stores:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        repo:
          - tggo/rdflibgo-mongostore
    steps:
      - uses: actions/checkout@v4
        with:
          path: rdflibgo

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Check out ${{ matrix.repo }}
        id: clone
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          path: satellite

      - name: Build and vet against this commit
        if: steps.clone.outcome == 'success'
        working-directory: satellite
        run: |
          go mod edit -replace github.com/tggo/goRDFlib=../rdflibgo
          go mod tidy
          go build ./...
          go vet ./...

      - name: Report a missing satellite
        if: steps.clone.outcome != 'success'
        run: echo "::notice::${{ matrix.repo }} is not reachable yet; skipping"
